[project]
name = "jarvis"
version = "0.1.0"
description = "Persoenlicher, autonom laufender Assistent"
requires-python = ">=3.12"
dependencies = [
    # Offizielles Anthropic-SDK. Wird ausschliesslich in
    # jarvis/llm/providers/anthropic.py und dort verzoegert importiert, damit
    # core/ und die Tests ohne Netz und ohne dieses Paket laufen.
    "anthropic>=0.40",
    # OAuth fuer Gmail. Nur der Zustimmungsablauf und die Token-Erneuerung --
    # die Gmail-Aufrufe selbst macht urllib, damit die Endpunkte sichtbar im
    # Code stehen und sich auf eine Allowlist einschraenken lassen.
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    # Dashboard. Starlette liefert Routing und Anfrageobjekte, uvicorn den
    # Server. Die Seiten selbst entstehen serverseitig als HTML -- kein
    # JavaScript-Framework, nichts nachzuladen.
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# httpx nur fuer Starlettes TestClient. Zur Laufzeit braucht JARVIS es nicht.
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
jarvis = "jarvis.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
