[project]
name = "jarvis"
version = "0.1.0"
description = "Persoenlicher, autonom laufender Assistent"
requires-python = ">=3.12"
dependencies = [
    # Offizielles Anthropic-SDK. Wird ausschliesslich in
    # jarvis/llm/providers/anthropic.py und dort verzoegert importiert, damit
    # core/ und die Tests ohne Netz und ohne dieses Paket laufen.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
jarvis = "jarvis.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
